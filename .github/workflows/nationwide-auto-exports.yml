name: Nationwide NPAAAD SAFDZ auto export queue
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
  push:
    paths:
      - '.github/nationwide-start.txt'
permissions:
  contents: read
concurrency:
  group: nationwide-gis-export-queue
  cancel-in-progress: false
jobs:
  nationwide:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install GIS dependencies
        run: pip install -r requirements.txt
      - name: Process next three resumable batches
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: npaaad-safdz-data
          BOUNDARY_R2_ACCESS_KEY_ID: ${{ secrets.BOUNDARY_R2_ACCESS_KEY_ID }}
          BOUNDARY_R2_SECRET_ACCESS_KEY: ${{ secrets.BOUNDARY_R2_SECRET_ACCESS_KEY }}
          BOUNDARY_R2_BUCKET: slopemap-gis-data
          BATCH_LIMIT: '30'
          MAX_BATCHES: '3'
        run: python nationwide_queue.py
