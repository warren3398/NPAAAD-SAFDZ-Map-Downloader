name: R2 GeoPackage QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'boto3>=1.34,<2' 'pyogrio>=0.10,<1' 'shapely>=2.0,<3' 'pyarrow>=16'
      - run: python qa/validate_r2.py
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: npaaad-safdz-data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2-qa-results
          path: qa-results.jsonl
