name: Free on-demand GIS export queue
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: read
concurrency:
  group: free-on-demand-gis-queue
  cancel-in-progress: false
jobs:
  process-one:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install GIS dependencies
        run: pip install -r requirements.txt
      - name: Process one queued map request
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: npaaad-safdz-data
          BOUNDARY_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          BOUNDARY_R2_ACCESS_KEY_ID: ${{ secrets.BOUNDARY_R2_ACCESS_KEY_ID }}
          BOUNDARY_R2_SECRET_ACCESS_KEY: ${{ secrets.BOUNDARY_R2_SECRET_ACCESS_KEY }}
          BOUNDARY_R2_BUCKET: slopemap-gis-data
        run: python process_export_request.py
