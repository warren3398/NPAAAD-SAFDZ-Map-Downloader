<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NPAAAD–SAFDZ Map Downloader</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:system-ui,Arial;background:#f3f6f4;color:#16382b}header{background:#12523c;color:white;padding:18px 24px}h1{font-size:22px;margin:0}.wrap{max-width:1200px;margin:20px auto;padding:0 14px}.controls{background:white;padding:16px;border-radius:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:flex;flex-direction:column;gap:5px;font-weight:600}select,button{font:inherit;padding:10px;border:1px solid #cad9d0;border-radius:8px;min-width:145px}button{background:#176e4c;color:white;cursor:pointer;border:0}button:disabled{opacity:.5;cursor:not-allowed}#map{height:62vh;min-height:350px;margin-top:14px;border-radius:12px}#status{padding:12px}small{color:#587266}</style></head><body><header><h1>NPAAAD–SAFDZ Map Downloader</h1><div>Provincial GIS datasets • Map preview and export</div></header><main class="wrap"><div class="controls"><label>Island group<select id="island"><option value="">Select island</option></select></label><label>Province<select id="province"><option value="">Select province</option></select></label><label>Layer<select id="layer"><option value="npaaad">NPAAAD</option><option value="safdz">SAFDZ</option></select></label><button id="load">Load map</button><button data-fmt="jpeg">JPEG</button><button data-fmt="pdf">PDF</button><button data-fmt="zip">Shapefile ZIP</button></div><div id="status" role="status">Connecting to dataset inventory…</div><div id="map"></div><p><small>Exports use the complete selected provincial dataset. Municipality clipping is not yet implemented. Satellite basemap is for preview; export imagery availability may vary.</small></p></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([12.5,122],5);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles © Esri',maxZoom:18}).addTo(map);let overlay,items=[];const $=id=>document.getElementById(id),status=s=>$('status').textContent=s;const title=s=>s.split('-').map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join(' ');function fill(id,values,placeholder){$(id).innerHTML='<option value="">'+placeholder+'</option>'+values.map(v=>'<option value="'+v+'">'+title(v)+'</option>').join('')}
fetch('/api/inventory').then(r=>r.json()).then(data=>{if(data.error)throw Error(data.error);items=data.items;fill('island',[...new Set(items.map(x=>x.island))],'Select island');status(items.length+' available layer datasets')}).catch(e=>status('Dataset inventory unavailable: '+e.message));
$('island').onchange=()=>fill('province',[...new Set(items.filter(x=>x.island===$('island').value).map(x=>x.province))].sort(),'Select province');
function params(){const island=$('island').value,province=$('province').value,layer=$('layer').value;if(!island||!province)throw Error('Select island and province');if(!items.some(x=>x.island===island&&x.province===province&&x.layer===layer))throw Error('Selected layer is unavailable');return new URLSearchParams({island,province,layer})}
let loadToken=0;
$('load').onclick=async()=>{const token=++loadToken;try{const p=params();$('load').disabled=true;if(overlay)map.removeLayer(overlay);overlay=L.geoJSON(null,{style:{color:'#f3dc45',weight:1,fillColor:'#20a36a',fillOpacity:.28}}).addTo(map);let offset=0,total=0;while(true){if(token!==loadToken)return;p.set('offset',offset);status('Loading map features: '+total.toLocaleString()+' loaded…');const r=await fetch('/api/preview?'+p);const raw=await r.text();let data;try{data=JSON.parse(raw)}catch{throw Error('Map server returned an incomplete response (HTTP '+r.status+').')}if(!r.ok)throw Error(data.error||'Preview failed (HTTP '+r.status+')');overlay.addData({type:'FeatureCollection',features:data.features||[]});total+=(data.features||[]).length;if(total===(data.features||[]).length&&overlay.getBounds().isValid())map.fitBounds(overlay.getBounds());if(!data.count||data.count<200)break;offset=data.nextOffset;if(offset>2000000)throw Error('Preview exceeds safety limit');}if(overlay.getBounds().isValid())map.fitBounds(overlay.getBounds());status('Map preview complete: '+total.toLocaleString()+' features loaded.')}catch(e){status(e.message)}finally{if(token===loadToken)$('load').disabled=false}};
document.querySelectorAll('[data-fmt]').forEach(b=>b.onclick=()=>{try{const p=params();p.set('format',b.dataset.fmt);window.location.href='/api/download?'+p;status('Preparing '+b.dataset.fmt.toUpperCase()+' download…')}catch(e){status(e.message)}})
</script></body></html>
